# GitHub Actions CI
# 每次 push / PR 到 master 时自动运行：Ruff + pytest + 文档同步检查

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -v --tb=short
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'sk-placeholder' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'tvly-placeholder' }}

  docs-sync:
    name: Docs Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run docs_sync_check
        env:
          CTG_DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os
          from src.tools.lint import docs_sync_check;
          base_ref = os.environ.get('CTG_DOCS_BASE_REF', '')
          if not base_ref or set(base_ref) == {'0'}:
              base_ref = 'HEAD^'
          result = docs_sync_check(base_ref=base_ref);
          print(result);
          if '🔴' in result:
              raise SystemExit(1)
          PY
