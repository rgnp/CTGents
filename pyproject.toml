[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctgents-agent"
version = "0.1.0"
description = "A terminal-native, self-improving coding and research agent with mechanical safety gates."
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "rgnp"}]
keywords = ["agent", "coding-assistant", "research-assistant", "terminal", "llm"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "tavily-python>=0.5.0",
    "trafilatura>=2.0.0",
    "lxml_html_clean",
    "curl_cffi>=0.7.0",
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "textual>=8.0.0",
]

[project.optional-dependencies]
research = [
    "sentence-transformers>=3.0.0",
    "pymupdf>=1.24.0",
]
dev = [
    "pymupdf>=1.24.0",
    "pytest>=7.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.0",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/rgnp/CTGents"
Repository = "https://github.com/rgnp/CTGents"
Issues = "https://github.com/rgnp/CTGents/issues"

[project.scripts]
ctg = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.ctgents_resources" = ["**/*.md", "**/*.yaml"]

# ── Ruff: 一站式 linter + formatter ──
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",           # Pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "D",           # pydocstyle
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "SIM",         # flake8-simplify
    "C4",          # flake8-comprehensions
]
ignore = [
    "D100",   # 不强制模块级 docstring
    "D101",   # 不强制 public class docstring
    "D102",   # 不强制 public method docstring
    "D103",   # 不强制 public function docstring
    "D104",   # 不强制包级 docstring
    "D105",   # 不强制 magic method docstring
    "D107",   # 不强制 __init__ 的 docstring
    "D203",   # 与 D211 冲突，显式忽略
    "D212",   # 与 D213 冲突，显式忽略
    "D213",   # 与 D212 冲突，显式忽略
    "D205",   # 中文 docstring 摘要与正文之间无空行
    "D400",   # 中文 docstring 以"。"结尾，不强制英文句号
    "D413",   # Returns 段落后缺少空行（中文风格）
    "D415",   # 中文 docstring 以"。"结尾，不强制英文句号
    "RUF001", # 中文项目允许全角标点在字符串中
    "RUF002", # 中文项目允许全角标点在 docstring 中
    "RUF003", # 中文项目允许全角标点在注释中
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D103"]
# 线性诊断脚本（pytest 忽略）：中途 import、长 mock 数据是脚本固有风格，非测试代码
"tests/analyze_cache_hitrate.py" = ["E402", "E501", "B905"]
"run.py" = ["D100", "D103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ── pytest: 测试配置 ──
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short -p no:cacheprovider --timeout=60 --ignore=tests/test_prefix_cache.py --ignore=tests/analyze_cache_hitrate.py"
markers = [
    "slow: 速度较慢的测试（L2 集成、上下文压缩等，>2s），pre-commit 快速门禁跳过",
]
